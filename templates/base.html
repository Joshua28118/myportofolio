{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block meta %}{% endblock meta %}
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a href="{% url 'main:show_main' %}" class="brand">
                {{ name }}
            </a>

            <nav aria-label="Navigasi utama">
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_education' %}">Education</a>
            </nav>

            <a href="{% url 'main:show_main' %}#contact" class="button">
                Let’s Connect ↗
            </a>
        </div>
    </header>

    {% block content %}{% endblock content %}

    <footer class="site-footer container">
        <p>
            &copy; 2026 {{ name }}.
            Fakultas Ilmu Komputer, Universitas Indonesia.
        </p>
    </footer>
</body>
</html>
