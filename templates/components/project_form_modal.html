<div id="add-project-modal" class="project-form-modal" popover="auto" role="dialog" aria-labelledby="add-project-modal-title">
    <button type="button" class="project-form-modal__backdrop" popovertarget="add-project-modal" popovertargetaction="hide" aria-label="Tutup formulir proyek"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close" popovertarget="add-project-modal" popovertargetaction="hide" aria-label="Tutup formulir proyek">×</button>
        <h2 id="add-project-modal-title">Tambah Proyek</h2>
        <form id="project-form" method="post" action="{% url 'main:create_project' %}" data-ajax-url="{% url 'main:create_project_ajax' %}" class="feature-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="feature-field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}<p class="feature-help">{{ field.help_text }}</p>{% endif %}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button" class="button" popovertarget="add-project-modal" popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Proyek</button>
            </div>
        </form>
    </div>
</div>
