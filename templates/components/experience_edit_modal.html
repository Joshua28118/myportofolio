<div id="edit-experience-modal" class="feature-dialog experience-form-modal" popover="auto" role="dialog" aria-labelledby="edit-experience-title">
    <button type="button" class="experience-modal-close" popovertarget="edit-experience-modal" popovertargetaction="hide" aria-label="Tutup formulir ubah Experience">×</button>
    <h2 id="edit-experience-title">Ubah Experience</h2>
    <form id="experience-edit-form" class="feature-form">
        {% csrf_token %}
        {% for field in edit_form %}
            <div class="feature-field">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}<p class="feature-help">{{ field.help_text }}</p>{% endif %}
            </div>
        {% endfor %}
        <div class="feature-actions">
            <button type="button" class="button" popovertarget="edit-experience-modal" popovertargetaction="hide">Batal</button>
            <button type="submit" class="button">Simpan Perubahan</button>
        </div>
    </form>
</div>
