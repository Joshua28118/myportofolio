{% if user.is_authenticated %}
    <form method="post" action="{% url 'main:toggle_star' project.id %}" class="star-form">
        {% csrf_token %}
        <button type="submit"
                class="button button-star{% if project.is_starred %} is-starred{% endif %}"
                aria-pressed="{{ project.is_starred|yesno:'true,false' }}">
            <span aria-hidden="true">&#9733;</span>
            {% if project.is_starred %}Unstar{% else %}Star{% endif %}
            <span class="star-count">{{ project.star_count }}</span>
        </button>
    </form>
{% else %}
    <span class="star-count">{{ project.star_count }} star</span>
    <a href="{% url 'main:login' %}?next={{ request.path|urlencode }}" class="text-link">Login untuk memberi star</a>
{% endif %}
